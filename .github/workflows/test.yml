name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install av==19.0.0 Pillow cryptography voluptuous==0.16.0 probatio==0.13.0
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components scripts tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --prefix .test-deps-js playwright@1.62.1
      - run: .test-deps-js/node_modules/.bin/playwright install --with-deps chromium
      - run: node --check custom_components/bambu_open_network/frontend/machine-panel.js
      - run: node tests/frontend/machine-panel.test.cjs
        env:
          NODE_PATH: ./.test-deps-js/node_modules
