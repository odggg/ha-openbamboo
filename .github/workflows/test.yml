name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install av==19.0.0 Pillow
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q custom_components scripts tests
